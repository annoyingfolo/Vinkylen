<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vinkylen</title>

    <!-- Streckkodsläsare -->
    <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f7f4f0;
            color: #2b2522;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-top: 30px;
        }

        p {
            color: #756d68;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 18px 30px;
            font-size: 18px;
            background: #5b2333;
            color: white;
            margin: 20px 0;
        }

        #camera {
            display: none;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            background: black;
            border-radius: 16px;
            overflow: hidden;
        }

        #video {
            display: block;
            width: 100%;
            height: auto;
        }

        #stop {
            display: none;
            background: #756d68;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <h1>🍷 Vinkylen</h1>

    <p>Din personliga vinlista</p>

    <button id="start">
        📷 Skanna vin
    </button>

    <div id="camera">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <button id="stop">
        Avsluta skanning
    </button>

    <div id="result"></div>

    <div style="margin-top: 50px;">
        0 viner i din logg
    </div>

    <script>

        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const camera = document.getElementById("camera");
        const video = document.getElementById("video");
        const result = document.getElementById("result");

        let codeReader = null;

        startButton.addEventListener("click", async () => {

            result.textContent = "";

            camera.style.display = "block";
            startButton.style.display = "none";
            stopButton.style.display = "inline-block";

            try {

                codeReader = new ZXing.BrowserMultiFormatReader();

                await codeReader.decodeFromVideoDevice(
                    undefined,
                    video,
                    (scanResult, error) => {

                        if (scanResult) {

                            const barcode = scanResult.getText();

                            result.textContent =
                                "Streckkod hittad: " + barcode;

                            codeReader.reset();

                            camera.style.display = "none";
                            stopButton.style.display = "none";
                            startButton.style.display = "inline-block";
                        }
                    }
                );

            } catch (error) {

                console.error(error);

                result.textContent =
                    "Kunde inte starta streckkodsläsaren.";

            }

        });

        stopButton.addEventListener("click", () => {

            if (codeReader) {
                codeReader.reset();
            }

            camera.style.display = "none";
            stopButton.style.display = "none";
            startButton.style.display = "inline-block";

        });

    </script>

</body>
</html>
