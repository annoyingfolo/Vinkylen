<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinbanken</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f7f4f0;
            color: #2b2522;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-top: 50px;
            margin-bottom: 10px;
        }

        p {
            color: #756d68;
            margin-bottom: 40px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 18px 30px;
            font-size: 18px;
            background: #5b2333;
            color: white;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .wine-count {
            margin-top: 60px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🍷 Vinbanken</h1>

    <p>Din personliga vinlista</p>

    <button onclick="alert('Kameran kommer här!')">
        + Skanna vin
    </button>

    <div class="wine-count">
        0 viner i din logg
    </div>

</body>
</html>
