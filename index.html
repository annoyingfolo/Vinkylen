<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vinkylen</title>

    <!-- Streckkodsläsare -->
    <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f7f4f0;
            color: #2b2522;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-top: 30px;
        }

        p {
            color: #756d68;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 18px 30px;
            font-size: 18px;
            background: #5b2333;
            color: white;
            margin: 10px 5px;
        }

        #camera {
            display: none;
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            background: black;
            border-radius: 16px;
            overflow: hidden;
        }

        #video {
            display: block;
            width: 100%;
            height: auto;
        }

        #scanFrame {
            position: absolute;
            left: 8%;
            right: 8%;
            top: 35%;
            height: 30%;
            border: 3px solid white;
            border-radius: 12px;
            box-sizing: border-box;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
        }

        #scanHint {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 15px;
            color: white;
            font-size: 15px;
            text-shadow: 0 1px 3px black;
            pointer-events: none;
        }

        #controls {
            display: none;
            margin: 5px auto 10px;
        }

        #controls button {
            padding: 12px 18px;
            font-size: 16px;
        }

        #stop {
            display: none;
            background: #756d68;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <h1>🍷 Vinkylen</h1>

    <p>Din personliga vinlista</p>

    <button id="start">
        📷 Skanna vin
    </button>

    <div id="camera">
        <video id="video" autoplay muted playsinline></video>

        <div id="scanFrame"></div>

        <div id="scanHint">
            Placera streckkoden innanför rutan
        </div>
    </div>

    <div id="controls">
        <button id="zoom">🔍 2×</button>
        <button id="torch" style="display:none;">🔦</button>
    </div>

    <button id="stop">
        Avsluta skanning
    </button>

    <div id="result"></div>

    <div style="margin-top: 50px;">
        0 viner i din logg
    </div>

    <script>
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const camera = document.getElementById("camera");
        const video = document.getElementById("video");
        const result = document.getElementById("result");
        const controls = document.getElementById("controls");
        const zoomButton = document.getElementById("zoom");
        const torchButton = document.getElementById("torch");

        let codeReader = null;
        let videoTrack = null;
        let currentZoom = 1;
        let torchOn = false;

        async function improveCamera() {
            if (!video.srcObject) {
                return;
            }

            const tracks = video.srcObject.getVideoTracks();

            if (!tracks.length) {
                return;
            }

            videoTrack = tracks[0];

            const capabilities = videoTrack.getCapabilities
                ? videoTrack.getCapabilities()
                : {};

            const advanced = {};

            // Försök använda kontinuerlig autofokus.
            if (
                capabilities.focusMode &&
                capabilities.focusMode.includes("continuous")
            ) {
                advanced.focusMode = "continuous";
            }

            // Börja med 2× zoom om kameran stöder det.
            if (capabilities.zoom) {
                currentZoom = Math.min(
                    2,
                    capabilities.zoom.max || 2
                );

                if (currentZoom >= 1) {
                    advanced.zoom = currentZoom;
                }

                zoomButton.style.display = "inline-block";
                zoomButton.textContent = "🔍 " + currentZoom + "×";
            } else {
                zoomButton.style.display = "none";
            }

            // Visa ficklampa om kameran stöder det.
            if (capabilities.torch) {
                torchButton.style.display = "inline-block";
            } else {
                torchButton.style.display = "none";
            }

            if (Object.keys(advanced).length) {
                try {
                    await videoTrack.applyConstraints({
                        advanced: [advanced]
                    });
                } catch (error) {
                    console.log("Kunde inte förbättra kameran:", error);
                }
            }
        }

        async function setZoom(zoom) {
            if (!videoTrack) {
                return;
            }

            const capabilities = videoTrack.getCapabilities
                ? videoTrack.getCapabilities()
                : {};

            if (!capabilities.zoom) {
                return;
            }

            const min = capabilities.zoom.min || 1;
            const max = capabilities.zoom.max || 1;

            const newZoom = zoom <= 1 ? min : Math.min(2, max);

            try {
                await videoTrack.applyConstraints({
                    advanced: [{ zoom: newZoom }]
                });

                currentZoom = newZoom;
                zoomButton.textContent = "🔍 " + newZoom + "×";
            } catch (error) {
                console.log("Kunde inte ändra zoom:", error);
            }
        }

        zoomButton.addEventListener("click", () => {
            setZoom(currentZoom > 1 ? 1 : 2);
        });

        torchButton.addEventListener("click", async () => {
            if (!videoTrack) {
                return;
            }

            try {
                torchOn = !torchOn;

                await videoTrack.applyConstraints({
                    advanced: [{ torch: torchOn }]
                });

                torchButton.textContent =
                    torchOn ? "🔦 På" : "🔦 Av";

            } catch (error) {
                console.log("Kunde inte använda ficklampan:", error);
            }
        });

        startButton.addEventListener("click", async () => {

            result.textContent = "";
            camera.style.display = "block";
            controls.style.display = "block";
            startButton.style.display = "none";
            stopButton.style.display = "inline-block";

            try {

                codeReader = new ZXing.BrowserMultiFormatReader();

                await codeReader.decodeFromConstraints(
                    {
                        video: {
                            facingMode: {
                                ideal: "environment"
                            },
                            width: {
                                ideal: 1920
                            },
                            height: {
                                ideal: 1080
                            }
                        },
                        audio: false
                    },
                    video,
                    (scanResult, error) => {

                        if (scanResult) {

                            const barcode = scanResult.getText();

                            result.textContent =
                                "Streckkod hittad: " + barcode;

                            codeReader.reset();

                            camera.style.display = "none";
                            controls.style.display = "none";
                            stopButton.style.display = "none";
                            startButton.style.display = "inline-block";

                            if (video.srcObject) {
                                video.srcObject
                                    .getTracks()
                                    .forEach(track => track.stop());
                            }

                            videoTrack = null;
                        }
                    }
                );

                // Vänta tills videoströmmen finns innan vi
                // försöker justera fokus/zoom/ficklampa.
                if (video.readyState >= 1) {
                    await improveCamera();
                } else {
                    video.addEventListener(
                        "loadedmetadata",
                        improveCamera,
                        { once: true }
                    );
                }

            } catch (error) {

                console.error(error);

                result.textContent =
                    "Kunde inte starta streckkodsläsaren.";

                camera.style.display = "none";
                controls.style.display = "none";
                stopButton.style.display = "none";
                startButton.style.display = "inline-block";
            }
        });

        stopButton.addEventListener("click", () => {

            if (codeReader) {
                codeReader.reset();
            }

            if (video.srcObject) {
                video.srcObject
                    .getTracks()
                    .forEach(track => track.stop());
            }

            videoTrack = null;
            torchOn = false;

            camera.style.display = "none";
            controls.style.display = "none";
            stopButton.style.display = "none";
            startButton.style.display = "inline-block";
        });

    </script>

</body>
</html>
