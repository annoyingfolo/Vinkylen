```html
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vinkylen</title>

    <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f7f4f0;
            color: #2b2522;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-top: 30px;
        }

        p {
            color: #756d68;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 18px 30px;
            font-size: 18px;
            background: #5b2333;
            color: white;
            margin: 20px 0;
        }

        #camera {
            display: none;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            background: black;
            border-radius: 16px;
            overflow: hidden;
        }

        #video {
            display: block;
            width: 100%;
            height: auto;
        }

        #stop {
            display: none;
            background: #756d68;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 600;
        }

        #product {
            display: none;
            max-width: 500px;
            margin: 25px auto;
            padding: 24px;
            background: white;
            border-radius: 18px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        #product h2 {
            margin: 0 0 6px 0;
            font-size: 28px;
        }

        #product .subtitle {
            color: #756d68;
            font-size: 19px;
            margin-bottom: 18px;
        }

        #product .details {
            line-height: 1.7;
        }

        #product .price {
            font-size: 24px;
            font-weight: 700;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <h1>🍷 Vinkylen</h1>

    <p>Din personliga vinlista</p>

    <button id="start">
        📷 Skanna vin
    </button>

    <div id="camera">
        <video id="video" autoplay muted playsinline></video>
    </div>

    <button id="stop">
        Avsluta skanning
    </button>

    <div id="result"></div>

    <div id="product">
        <h2 id="productName"></h2>
        <div class="subtitle" id="productProducer"></div>

        <div class="details">
            <div id="productVintage"></div>
            <div id="productCountry"></div>
            <div id="productVolume"></div>
            <div id="productAlcohol"></div>
        </div>

        <div class="price" id="productPrice"></div>
    </div>

    <div style="margin-top: 50px;">
        0 viner i din logg
    </div>

    <script>
        const startButton = document.getElementById("start");
        const stopButton = document.getElementById("stop");
        const camera = document.getElementById("camera");
        const video = document.getElementById("video");
        const result = document.getElementById("result");
        const product = document.getElementById("product");

        const productName = document.getElementById("productName");
        const productProducer = document.getElementById("productProducer");
        const productVintage = document.getElementById("productVintage");
        const productCountry = document.getElementById("productCountry");
        const productVolume = document.getElementById("productVolume");
        const productAlcohol = document.getElementById("productAlcohol");
        const productPrice = document.getElementById("productPrice");

        let codeReader = null;

        async function lookupWine(barcode) {
            result.textContent = "Hämtar produktinformation…";
            product.style.display = "none";

            try {
                const response = await fetch(
                    "https://vinkylen-api.jonas-zackrisson.workers.dev/?ean=" +
                    encodeURIComponent(barcode)
                );

                const data = await response.json();

                if (!response.ok) {
                    result.textContent =
                        data.error || "Kunde inte hitta vinet.";
                    return;
                }

                productName.textContent = data.name || "Okänt vin";
                productProducer.textContent = data.producer || "";

                productVintage.textContent =
                    data.vintage
                        ? "Årgång: " + data.vintage
                        : "";

                productCountry.textContent =
                    data.country
                        ? "Land: " + data.country
                        : "";

                productVolume.textContent =
                    data.volume
                        ? "Volym: " + data.volume + " ml"
                        : "";

                productAlcohol.textContent =
                    data.alcoholPercentage
                        ? "Alkohol: " + data.alcoholPercentage + " %"
                        : "";

                productPrice.textContent =
                    data.price != null
                        ? data.price + " kr"
                        : "";

                result.textContent =
                    "Streckkod: " + barcode;

                product.style.display = "block";

            } catch (error) {
                console.error(error);
                result.textContent =
                    "Kunde inte hämta produktinformationen.";
            }
        }

        startButton.addEventListener("click", async () => {

            result.textContent = "";
            product.style.display = "none";

            camera.style.display = "block";
            startButton.style.display = "none";
            stopButton.style.display = "inline-block";

            try {

                codeReader = new ZXing.BrowserMultiFormatReader();

                await codeReader.decodeFromVideoDevice(
                    undefined,
                    video,
                    (scanResult, error) => {

                        if (scanResult) {

                            const barcode = scanResult.getText();

                            codeReader.reset();

                            camera.style.display = "none";
                            stopButton.style.display = "none";
                            startButton.style.display = "inline-block";

                            lookupWine(barcode);
                        }
                    }
                );

            } catch (error) {

                console.error(error);

                result.textContent =
                    "Kunde inte starta streckkodsläsaren.";
            }
        });

        stopButton.addEventListener("click", () => {

            if (codeReader) {
                codeReader.reset();
            }

            camera.style.display = "none";
            stopButton.style.display = "none";
            startButton.style.display = "inline-block";
        });
    </script>

</body>
</html>
```
