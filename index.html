<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinkylen</title>

    <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f7f4f0;
            color: #2b2522;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        p {
            color: #756d68;
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 18px 30px;
            font-size: 18px;
            background: #5b2333;
            color: white;
            margin: 15px 0;
        }

        #videoContainer {
            display: none;
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 16px;
            overflow: hidden;
            background: black;
        }

        #video {
            display: block;
            width: 100%;
            height: auto;
        }

        #stopButton {
            display: none;
            background: #756d68;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <h1>🍷 Vinkylen</h1>

    <p>Din personliga vinlista</p>

    <button id="scanButton">
        📷 Skanna vin
    </button>

    <div id="videoContainer">
        <video id="video" autoplay playsinline></video>
    </div>

    <button id="stopButton">
        Avsluta skanning
    </button>

    <div id="result"></div>

    <div style="margin-top: 50px;">
        0 viner i din logg
    </div>

    <script>
        const scanButton = document.getElementById("scanButton");
        const stopButton = document.getElementById("stopButton");
        const videoContainer = document.getElementById("videoContainer");
        const video = document.getElementById("video");
        const result = document.getElementById("result");

        let scanner = null;

        scanButton.addEventListener("click", async () => {

            result.textContent = "";
            videoContainer.style.display = "block";
            stopButton.style.display = "inline-block";
            scanButton.style.display = "none";

            scanner = new ZXing.BrowserMultiFormatReader();

            try {
                const devices = await scanner.listVideoInputDevices();

                if (devices.length === 0) {
                    result.textContent = "Ingen kamera hittades.";
                    return;
                }

                // Försök använda den bakre kameran
                let cameraId = devices[devices.length - 1].deviceId;

                scanner.decodeFromVideoDevice(
                    cameraId,
                    video,
                    (scanResult, error) => {

                        if (scanResult) {
                            const barcode = scanResult.getText();

                            result.textContent =
                                "Streckkod hittad: " + barcode;

                            scanner.reset();

                            videoContainer.style.display = "none";
                            stopButton.style.display = "none";
                            scanButton.style.display = "inline-block";
                        }
                    }
                );

            } catch (error) {
                console.error(error);
                result.textContent =
                    "Kunde inte starta kameran.";
            }
        });

        stopButton.addEventListener("click", () => {

            if (scanner) {
                scanner.reset();
            }

            videoContainer.style.display = "none";
            stopButton.style.display = "none";
            scanButton.style.display = "inline-block";
        });
    </script>

</body>
</html>
